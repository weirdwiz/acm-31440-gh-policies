# Test policy pushed from the Global Hub's Argo CD onto regional-hub's own ACM.
# regional-hub's governance framework then propagates it to vm-cluster.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: global-policies
spec:
  clusterSet: default
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: vm-clusters
  namespace: global-policies
spec:
  clusterSets: [default]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          name: vm-cluster
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gh-push-test
  namespace: global-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: gh-push-test
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: gh-push-test
              namespace: default
            data:
              source: global-hub-argocd
              version: v2
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: gh-push-test
  namespace: global-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: vm-clusters
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: gh-push-test
