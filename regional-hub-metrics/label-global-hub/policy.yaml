# Enforced by the Global Hub's own governance on its local-cluster.
# musthave merges into MCOA's templates: it adds only externalLabels.managed_hub=global-hub, so GH's own series
# stay distinct from the regional hub's local-cluster series. If MCOA re-renders a template, the Policy re-adds it.
# Template names follow GH's MCOA placement `global-mcoa` (prerequisite); update them if that placement changes.
# Uses ManagedClusterSetBinding `default` in this namespace, created by app sync-secret-to-regional-hub.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: label-global-hub-metrics
  namespace: open-cluster-management-observability
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: label-global-hub-metrics
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: monitoring.rhobs/v1alpha1
            kind: PrometheusAgent
            metadata:
              name: mcoa-default-platform-metrics-collector-global-mcoa
              namespace: open-cluster-management-observability
            spec:
              externalLabels:
                managed_hub: global-hub
        - complianceType: musthave
          objectDefinition:
            apiVersion: monitoring.rhobs/v1alpha1
            kind: PrometheusAgent
            metadata:
              name: mcoa-default-user-workload-metrics-collector-global-mcoa
              namespace: open-cluster-management-observability
            spec:
              externalLabels:
                managed_hub: global-hub
---
# Selects only the Global Hub's own local-cluster.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: label-global-hub-metrics
  namespace: open-cluster-management-observability
spec:
  clusterSets:
  - default
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          local-cluster: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: label-global-hub-metrics
  namespace: open-cluster-management-observability
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: label-global-hub-metrics
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: label-global-hub-metrics
