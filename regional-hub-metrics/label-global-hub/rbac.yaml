# Lets the Global Hub's Argo application-controller create this app's Policy, Placement and PlacementBinding.
# Argo never touches MCOA's PrometheusAgents; the Policy does. Wave -1: applied first in the same sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: label-global-hub-metrics
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
- apiGroups: ["policy.open-cluster-management.io"]
  resources: ["policies", "placementbindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["placements"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: label-global-hub-metrics
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: label-global-hub-metrics
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
