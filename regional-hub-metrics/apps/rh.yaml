# Argo Application pushed to regional-hub (Argo cluster secret openshift-gitops/regional-hub-gitops-cluster-secret).
# Delivers one Policy that the regional hub's own governance enforces on its local-cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regional-hub-metrics-rh
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/weirdwiz/acm-31440-gh-policies.git
    targetRevision: regional-hub-metrics
    path: regional-hub-metrics/rh
  destination:
    server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/regional-hub
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
