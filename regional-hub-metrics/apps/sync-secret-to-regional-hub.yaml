# Global Hub: copies GH's metrics write cert to the regional hub (Policy -> ManifestWork -> Secret).
# Bootstrap all apps once: KUBECONFIG=$HOME/.kube/acm-31440-gh oc apply -f regional-hub-metrics/apps/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-secret-to-regional-hub
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/weirdwiz/acm-31440-gh-policies.git
    targetRevision: regional-hub-metrics
    path: regional-hub-metrics/sync-secret
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
