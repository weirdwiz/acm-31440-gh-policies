# Global Hub: labels GH's own series managed_hub=global-hub so they never mix with the regional hub's local-cluster.
# Bootstrap all apps once: KUBECONFIG=$HOME/.kube/acm-31440-gh oc apply -f regional-hub-metrics/apps/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: label-global-hub-metrics
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/weirdwiz/acm-31440-gh-policies.git
    targetRevision: regional-hub-metrics
    path: regional-hub-metrics/label-global-hub
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
