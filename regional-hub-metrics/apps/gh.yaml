# Argo Application on the Global Hub (in-cluster): delivers GH's write cert to regional-hub and labels GH's own series.
# Bootstrap once: KUBECONFIG=$HOME/.kube/acm-31440-gh oc apply -f regional-hub-metrics/apps/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regional-hub-metrics-gh
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/weirdwiz/acm-31440-gh-policies.git
    targetRevision: regional-hub-metrics
    path: regional-hub-metrics/gh
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
