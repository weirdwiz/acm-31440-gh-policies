# Enforced by the regional hub's own governance on its local-cluster (RH's policy controller works for RH itself).
# musthave appends array items and patches items whose `name` matches, so this adds only the global-hub
# remoteWrite entry. MCOA's own acm-observability entry is never copied here; MCOA keeps non-acm entries and
# listed secrets (agentssa.go) and replicates spec.secrets into the agent namespace (handler.go:276).
# Only the rh-self template (RH's local-cluster) gets the Global Hub entry; rh-leaves (vm-cluster) never does.
# Lives in ACM's open-cluster-management-global-set namespace, which already has ManagedClusterSetBinding `global`.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rh-metrics-to-global-hub
  namespace: open-cluster-management-global-set
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: rh-metrics-to-global-hub
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        # RH's own platform collector, the only one that writes to the Global Hub. On the way to GH only, its
        # cluster="local-cluster" becomes cluster="regional-hub", the name GH knows it by (a GH ManagedCluster), so GH's
        # dashboards list it. RH's own store keeps local-cluster.
        - complianceType: musthave
          objectDefinition:
            apiVersion: monitoring.rhobs/v1alpha1
            kind: PrometheusAgent
            metadata:
              name: mcoa-default-platform-metrics-collector-rh-self
              namespace: open-cluster-management-observability
            spec:
              secrets:
              - gh-observatorium-client
              remoteWrite:
              - name: global-hub
                url: https://observatorium-api-open-cluster-management-observability.apps.dkamboj-global-hub.az.dev09.red-chesterfield.com/api/metrics/v1/default/api/v1/receive
                remoteTimeout: 30s
                tlsConfig:
                  caFile: /etc/prometheus/secrets/gh-observatorium-client/ca.crt
                  certFile: /etc/prometheus/secrets/gh-observatorium-client/tls.crt
                  keyFile: /etc/prometheus/secrets/gh-observatorium-client/tls.key
                writeRelabelConfigs:
                - action: replace
                  sourceLabels: [cluster]
                  regex: local-cluster
                  targetLabel: cluster
                  replacement: regional-hub
---
# Selects only the regional hub's own local-cluster.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rh-local-only
  namespace: open-cluster-management-global-set
spec:
  clusterSets:
  - global
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          local-cluster: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: rh-metrics-to-global-hub
  namespace: open-cluster-management-global-set
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rh-local-only
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: rh-metrics-to-global-hub
