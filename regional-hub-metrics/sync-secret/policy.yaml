# Copies the Global Hub's metrics write cert, and the name GH knows each hub by, to every managed hub.
# Managed hubs = ManagedClusters running the Global Hub agent (label feature...addon-multicluster-global-hub-controller=available);
# a new hub gets its ManifestWork automatically.
# Enforced by the Global Hub's own governance on its local-cluster. The managed-cluster templates ({{ fromSecret }},
# no `hub`) are resolved there at enforcement time, so they can read the MCO-managed secrets in
# open-cluster-management-observability and are re-evaluated when GH renews its client cert. No key material is in Git.
# The ManifestWork is the only way a GH object reaches the hosted-mode regional hub (GH's policy controller is off there).
# The Secret name (gh-observatorium-client) is not an MCOA name, so it never clashes with RH's own MCOA.
# Lives in ACM's open-cluster-management-global-set namespace, which already has ManagedClusterSetBinding `global`.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gh-cert-to-regional-hub
  namespace: open-cluster-management-global-set
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: gh-cert-to-regional-hub
      spec:
        remediationAction: enforce
        severity: low
        object-templates-raw: |
          {{- range $hub := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "" "feature.open-cluster-management.io/addon-multicluster-global-hub-controller=available").items }}
          - complianceType: musthave
            objectDefinition:
              apiVersion: work.open-cluster-management.io/v1
              kind: ManifestWork
              metadata:
                name: acm47259-gh-write-cert
                namespace: {{ $hub.metadata.name }}
              spec:
                workload:
                  manifests:
                  - apiVersion: v1
                    kind: Secret
                    metadata:
                      name: gh-observatorium-client
                      namespace: open-cluster-management-observability
                    type: Opaque
                    data:
                      tls.crt: '{{ fromSecret "open-cluster-management-observability" "observability-controller-open-cluster-management.io-observability-signer-client-cert" "tls.crt" }}'
                      tls.key: '{{ fromSecret "open-cluster-management-observability" "observability-controller-open-cluster-management.io-observability-signer-client-cert" "tls.key" }}'
                      ca.crt: '{{ fromSecret "open-cluster-management-observability" "observability-server-ca-certs" "ca.crt" }}'
                  # The name the Global Hub knows this hub by; RH's Policy uses it to relabel cluster="local-cluster".
                  - apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: global-hub-identity
                      namespace: open-cluster-management-observability
                    data:
                      clusterName: {{ $hub.metadata.name }}
          {{- end }}
---
# Selects only the Global Hub's own local-cluster.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: gh-local-only
  namespace: open-cluster-management-global-set
spec:
  clusterSets:
  - global
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          local-cluster: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: gh-cert-to-regional-hub
  namespace: open-cluster-management-global-set
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: gh-local-only
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: gh-cert-to-regional-hub
