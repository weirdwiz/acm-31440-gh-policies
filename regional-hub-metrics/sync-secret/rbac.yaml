# Lets the Global Hub's Argo application-controller create this app's Policy, Placement and PlacementBinding.
# Its built-in ClusterRole has no ACM group rights; it can create this grant itself because it holds
# rbac.authorization.k8s.io "*". Wave -1: applied first in the same sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sync-secret-to-regional-hub
  namespace: open-cluster-management-global-set
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
- apiGroups: ["policy.open-cluster-management.io"]
  resources: ["policies", "placementbindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["placements"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-secret-to-regional-hub
  namespace: open-cluster-management-global-set
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sync-secret-to-regional-hub
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
