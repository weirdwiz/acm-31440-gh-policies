# wave 0: GH-side cert delivery (Policy -> ManifestWork regional-hub/acm47259-gh-write-cert) and GH label templates.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: writestorage-gh-cert
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/weirdwiz/acm-31440-gh-policies.git
    targetRevision: writestorage-e2e
    path: writestorage/gh/cert
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
