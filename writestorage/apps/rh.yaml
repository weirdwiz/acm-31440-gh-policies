# Argo Application pushed to regional-hub (destination = Argo cluster secret openshift-gitops/regional-hub-gitops-cluster-secret).
# Retries with backoff: the endpoint works only after the GH cert ManifestWork is Applied on RH.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: writestorage-rh
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/weirdwiz/acm-31440-gh-policies.git
    targetRevision: writestorage-e2e
    path: writestorage/rh
  destination:
    server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/regional-hub
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
    - ServerSideApply=true
