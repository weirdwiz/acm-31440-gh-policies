# Partial MCO spec (server-side applied) on regional-hub: forward everything RH receives to GH's observatorium-api.
# Endpoint secret must live in open-cluster-management-observability on RH (see endpoint-secret.yaml).
apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageConfig:
    writeStorage:
    - name: gh-observatorium-endpoint
      key: ep.yaml
