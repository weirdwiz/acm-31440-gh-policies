# writeStorage endpoint (format: MCO pkg remotewriteendpoint, one RemoteWriteEndpoint per secret key ep.yaml).
# Contains the GH observatorium-api URL and the NAMES of the cert secret keys only. No key material.
# The client cert/key/CA live in Secret gh-observatorium-client, delivered by GH ManifestWork acm47259-gh-write-cert.
apiVersion: v1
kind: Secret
metadata:
  name: gh-observatorium-endpoint
  namespace: open-cluster-management-observability
type: Opaque
stringData:
  ep.yaml: |
    name: gh-observatorium-endpoint
    url: https://observatorium-api-open-cluster-management-observability.apps.dkamboj-global-hub.az.dev09.red-chesterfield.com/api/metrics/v1/default/api/v1/receive
    http_client_config:
      tls_config:
        secret_name: gh-observatorium-client
        ca_file_key: ca.crt
        cert_file_key: tls.crt
        key_file_key: tls.key
