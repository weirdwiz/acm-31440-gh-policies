# RH's own MCOA hub templates (names from the per-placement templates: rh-self = local-cluster, rh-leaves = vm-cluster).
# RH-owned series carry managed_hub=regional-hub. Partial objects, server-side applied, operator-owned: never prune or delete.
apiVersion: monitoring.rhobs/v1alpha1
kind: PrometheusAgent
metadata:
  name: mcoa-default-platform-metrics-collector-rh-self
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  externalLabels:
    managed_hub: regional-hub
---
apiVersion: monitoring.rhobs/v1alpha1
kind: PrometheusAgent
metadata:
  name: mcoa-default-user-workload-metrics-collector-rh-self
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  externalLabels:
    managed_hub: regional-hub
---
apiVersion: monitoring.rhobs/v1alpha1
kind: PrometheusAgent
metadata:
  name: mcoa-default-platform-metrics-collector-rh-leaves
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  externalLabels:
    managed_hub: regional-hub
---
apiVersion: monitoring.rhobs/v1alpha1
kind: PrometheusAgent
metadata:
  name: mcoa-default-user-workload-metrics-collector-rh-leaves
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  externalLabels:
    managed_hub: regional-hub
