# RBAC for the Global Hub's Argo application-controller (openshift-gitops-argocd-application-controller).
# Its built-in ClusterRole has no ACM group rights, so these grants cover only what gh/ needs.
# Wave -1: applied before the Policy, Placement and PrometheusAgent objects in the same sync.
# The controller can create them because its ClusterRole holds rbac.authorization.k8s.io "*" verbs.
# Namespace is open-cluster-management-observability: the hub fromSecret template is restricted to the
# policy's own namespace, so the cert Policy must live where the MCO source secrets are.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: writestorage-argo-gh
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
- apiGroups: ["policy.open-cluster-management.io"]
  resources: ["policies", "placementbindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["placements", "managedclustersetbindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["monitoring.rhobs"]
  resources: ["prometheusagents"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: writestorage-argo-gh
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: writestorage-argo-gh
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
---
# Cluster-scoped: the MCSB admission webhook requires "bind" on the clusterset "default".
# A namespaced Role cannot grant this (managedclustersets is cluster-scoped), so use a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: writestorage-argo-clusterset-bind
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["managedclustersets/bind"]
  resourceNames: ["default"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: writestorage-argo-clusterset-bind
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: writestorage-argo-clusterset-bind
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
